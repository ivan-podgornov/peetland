name: Build docs
description: Build the docs of a branch and upload them for publish-pages
inputs:
  branch:
    description: Branch whose docs are built, for example main or feat/npc
    required: true
runs:
  using: composite
  steps:
    - name: Build docs
      shell: bash
      env:
        DOCS_URL: https://${{ github.repository_owner }}.github.io
        DOCS_BASE_URL: /${{ github.event.repository.name }}/${{ inputs.branch }}/docs/
        DOCS_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        DOCS_BRANCH: ${{ inputs.branch }}
      run: npm run build -w @peetland/docs
    - name: Upload docs
      uses: ./.github/workflows/upload-pages
      with:
        folder: docs
        source: docs/build
