name: Build tests
description: Run tests and upload the Allure report for publish-pages
inputs:
  history-branch:
    description: Branch whose report history is shown in this report, for example main. Empty for no history
    required: false
    default: ''
  publish-history:
    description: Whether to publish the history with this run appended, 'true' or 'false'
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Download history
      if: ${{ inputs.history-branch != '' }}
      shell: bash
      env:
        BRANCH: ${{ inputs.history-branch }}
      run: |
        # История прошлых прогонов лежит рядом с прошлым отчётом. Берём её из ветки gh-pages, а не
        # с GitHub Pages: там она может быть закэширована. Если отчёта ещё нет, история начинается
        # с этого прогона
        mkdir -p .allure
        if git fetch --depth 1 origin gh-pages &&
          git show "FETCH_HEAD:$BRANCH/tests/history.jsonl" > .allure/history.jsonl; then
          echo "История: $(wc -l < .allure/history.jsonl) прогонов"
        else
          rm -f .allure/history.jsonl
          echo "Истории ещё нет"
        fi
    - name: Test
      shell: bash
      run: npm run test:report
    # Дальше шаги идут и при упавших тестах: отчёт нужен, чтобы увидеть, что сломалось. Джоба при
    # этом всё равно остаётся красной
    - name: Generate report
      if: ${{ !cancelled() }}
      shell: bash
      run: npm run test:report:generate
    - name: Keep history
      if: ${{ !cancelled() && inputs.publish-history == 'true' }}
      shell: bash
      run: cp .allure/history.jsonl .allure/report/history.jsonl
    - name: Upload report
      if: ${{ !cancelled() }}
      uses: ./.github/workflows/upload-pages
      with:
        folder: tests
        source: .allure/report
