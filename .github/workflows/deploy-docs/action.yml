name: Deploy docs
description: Build the docs of a branch and publish them to <branch>/docs in the gh-pages branch
inputs:
  branch:
    description: Branch whose docs are published, for example main or feat/npc
    required: true
  token:
    description: Token with contents write permission
    required: true
runs:
  using: composite
  steps:
    - name: Build docs
      shell: bash
      env:
        DOCS_URL: https://${{ github.repository_owner }}.github.io
        DOCS_BASE_URL: /${{ github.event.repository.name }}/${{ inputs.branch }}/docs/
        DOCS_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        DOCS_BRANCH: ${{ inputs.branch }}
      run: npm run build -w @peetland/docs
    - name: Publish docs
      uses: ./.github/workflows/publish-pages
      with:
        branch: ${{ inputs.branch }}
        folder: docs
        source: docs/build
        token: ${{ inputs.token }}
