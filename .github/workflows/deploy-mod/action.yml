name: Deploy mod
description: Build the mod of a branch and publish it to <branch>/mod in the gh-pages branch
inputs:
  branch:
    description: Branch whose mod is published, for example main or feat/npc
    required: true
  token:
    description: Token with contents write permission
    required: true
runs:
  using: composite
  steps:
    - name: Build mod
      shell: bash
      run: npm run build -w @peetland/mod
    - name: Publish mod
      uses: ./.github/workflows/publish-pages
      with:
        branch: ${{ inputs.branch }}
        folder: mod
        source: mod/mod/dist
        token: ${{ inputs.token }}
