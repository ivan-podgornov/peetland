name: Lint
description: Check types, code, dependencies and formatting
runs:
  using: composite
  steps:
    - name: Check types
      shell: bash
      run: npm run check:types
    - name: Lint
      shell: bash
      run: npm run check:code:all
    - name: Check dependencies
      shell: bash
      run: npm run check:deps
    - name: Lint formatting
      shell: bash
      run: npm run check:formatting:all
