name: Release

on:
  push:
    branches:
      - main

# Релизы идут строго по очереди: следующий ждёт, а не отменяет текущий.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare environment
        uses: ./.github/workflows/prepare-environment
      - name: Build
        run: npm run build -w @peetland/mod
      - uses: actions/upload-artifact@v7
        with:
          name: peetland
          path: mod/mod/dist/peetland.lua
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/releases/latest/download/peetland.lua
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: peetland
      - name: Publish release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ github.run_number }}
        run: |
          gh release create "$TAG" peetland.lua \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            --latest
