name: Merge

# Публикует сборку мода, документацию и отчёт о тестах main после мержа. Проверки уже прошли в пулл
# реквесте, а тесты запускаются только ради отчёта
on:
  push:
    branches:
      - main

# Новый мерж отменяет предыдущий запуск: публиковать нужно только свежие сборки
concurrency:
  group: merge
  cancel-in-progress: true

jobs:
  mod:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: mod
      url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/main/mod/peetland.lua
    steps:
      - uses: actions/checkout@v7
      - name: Prepare environment
        uses: ./.github/workflows/prepare-environment
      - name: Deploy mod
        uses: ./.github/workflows/deploy-mod
        with:
          branch: main
          token: ${{ github.token }}

  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: docs
      url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/main/docs/
    steps:
      - uses: actions/checkout@v7
      - name: Prepare environment
        uses: ./.github/workflows/prepare-environment
      - name: Deploy docs
        uses: ./.github/workflows/deploy-docs
        with:
          branch: main
          token: ${{ github.token }}

  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: tests
      url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/main/tests/
    steps:
      - uses: actions/checkout@v7
      - name: Prepare environment
        uses: ./.github/workflows/prepare-environment
      - name: Test
        uses: ./.github/workflows/deploy-tests
        with:
          branch: main
          # История прогонов main: из неё отчёт строит тренды и находит нестабильные тесты
          history: 'true'
          token: ${{ github.token }}
