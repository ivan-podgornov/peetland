name: Merge

# Публикует сборку мода, документацию и отчёт о тестах main после мержа одним пушем. Проверки уже
# прошли в пулл реквесте, а тесты запускаются только ради отчёта
on:
  push:
    branches:
      - main

# Новый мерж отменяет предыдущий запуск: публиковать нужно только свежие сборки
concurrency:
  group: merge
  cancel-in-progress: true

jobs:
  mod:
    runs-on: ubuntu-latest
    environment:
      name: mod
      url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/main/mod/peetland.lua
    steps:
      - uses: actions/checkout@v7
      - name: Prepare environment
        uses: ./.github/workflows/prepare-environment
      - name: Build mod
        uses: ./.github/workflows/build-mod

  docs:
    runs-on: ubuntu-latest
    environment:
      name: docs
      url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/main/docs/
    steps:
      - uses: actions/checkout@v7
      - name: Prepare environment
        uses: ./.github/workflows/prepare-environment
      - name: Build docs
        uses: ./.github/workflows/build-docs
        with:
          branch: main

  tests:
    runs-on: ubuntu-latest
    environment:
      name: tests
      url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/main/tests/
    steps:
      - uses: actions/checkout@v7
      - name: Prepare environment
        uses: ./.github/workflows/prepare-environment
      - name: Test
        uses: ./.github/workflows/build-tests
        with:
          # История прогонов main: из неё отчёт строит тренды и находит нестабильные тесты. Отчёт main
          # дописывает в неё свой прогон и публикует
          history-branch: main
          publish-history: 'true'

  # Публикует одним пушем всё, что собрали mod, docs и tests, даже если что-то из них упало
  publish:
    needs: [mod, docs, tests]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Prepare environment
        uses: ./.github/workflows/prepare-environment
      - name: Publish pages
        uses: ./.github/workflows/publish-pages
        with:
          branch: main
          token: ${{ github.token }}
