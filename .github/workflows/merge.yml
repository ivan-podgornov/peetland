name: Merge

# Проверяет main после мержа и публикует её документацию
on:
  push:
    branches:
      - main

# Новый мерж отменяет предыдущий запуск: публиковать нужно только свежую документацию
concurrency:
  group: merge
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 50
      - name: Prepare environment
        uses: ./.github/workflows/prepare-environment
      - name: Lint
        uses: ./.github/workflows/lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare environment
        uses: ./.github/workflows/prepare-environment
      - name: Test
        run: npm test

  build-mod:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare environment
        uses: ./.github/workflows/prepare-environment
      - name: Build mod
        uses: ./.github/workflows/build-mod

  docs:
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: docs
      url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/main/
    steps:
      - uses: actions/checkout@v7
      - name: Prepare environment
        uses: ./.github/workflows/prepare-environment
      - name: Deploy docs
        uses: ./.github/workflows/deploy-docs
        with:
          branch: main
          token: ${{ github.token }}
