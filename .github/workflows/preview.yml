name: Preview

# Пре-релиз публикуется сам, когда у пулл реквеста есть или появляется метка test-gta-sa: при
# добавлении метки и при каждом новом пуше. Вручную: Actions → Preview → Run workflow, ветка пулл
# реквеста
on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled

# Новый запуск для той же ветки отменяет предыдущий
concurrency:
  group: preview-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  GH_REPO: ${{ github.repository }}
  GH_TOKEN: ${{ github.token }}

jobs:
  pull-request:
    # Из событий пулл реквеста запускаемся, только если добавили метку test-gta-sa или она уже есть
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'test-gta-sa') ||
      (github.event.action != 'labeled' &&
      contains(github.event.pull_request.labels.*.name, 'test-gta-sa'))
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.find.outputs.number }}
      branch: ${{ steps.find.outputs.branch }}
      sha: ${{ steps.find.outputs.sha }}
    steps:
      - name: Find open pull request
        id: find
        env:
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          EVENT_PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # В событии пулл реквеста GITHUB_SHA и GITHUB_REF_NAME указывают на merge-коммит, поэтому
          # ветку и коммит берём из самого пулл реквеста
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            {
              echo "number=$EVENT_PR_NUMBER"
              echo "branch=$EVENT_PR_BRANCH"
              echo "sha=$EVENT_PR_SHA"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          number=$(gh pr list --head "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number')

          if [ -z "$number" ]; then
            echo "::error::Для ветки $GITHUB_REF_NAME нет открытого пулл реквеста"
            exit 1
          fi

          {
            echo "number=$number"
            echo "branch=$GITHUB_REF_NAME"
            echo "sha=$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: pull-request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.pull-request.outputs.sha }}
      - name: Prepare environment
        uses: ./.github/workflows/prepare-environment
      - name: Build
        run: npm run build -w @peetland/mod
      - uses: actions/upload-artifact@v7
        with:
          name: peetland
          path: mod/mod/dist/peetland.lua
          if-no-files-found: error

  deploy:
    needs: [pull-request, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PR_NUMBER: ${{ needs.pull-request.outputs.number }}
      PR_BRANCH: ${{ needs.pull-request.outputs.branch }}
      PR_SHA: ${{ needs.pull-request.outputs.sha }}
      TAG: pr-${{ needs.pull-request.outputs.number }}
    environment:
      name: preview
      url: https://github.com/${{ github.repository }}/releases/download/pr-${{ needs.pull-request.outputs.number }}/peetland.lua
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: peetland
      - name: Publish pre-release
        run: |
          pr_title=$(gh pr view "$PR_NUMBER" --json title --jq .title)

          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" peetland.lua \
            --prerelease \
            --target "$PR_SHA" \
            --title "PR #$PR_NUMBER: $pr_title" \
            --notes "Сборка из $PR_BRANCH ($PR_SHA)"
