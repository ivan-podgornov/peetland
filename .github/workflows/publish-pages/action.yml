name: Publish pages
description: Publish a folder to <branch>/<folder> in the gh-pages branch
inputs:
  branch:
    description: Branch whose build is published, for example main or feat/npc
    required: true
  folder:
    description: Folder inside the branch folder, for example docs or mod
    required: true
  source:
    description: Folder with the files to publish, relative to the repository root
    required: true
  token:
    description: Token with contents write permission
    required: true
runs:
  using: composite
  steps:
    - name: Publish
      shell: bash
      env:
        DEST: ${{ inputs.branch }}/${{ inputs.folder }}
        SOURCE: ${{ inputs.source }}
        REPO: https://x-access-token:${{ inputs.token }}@github.com/${{ github.repository }}.git
      run: |
        # gh-pages не разбирает имя бота в --user, поэтому берёт автора из конфига git
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

        # Сборки всех веток лежат в одной ветке gh-pages, поэтому пуши из параллельных запусков могут
        # конфликтовать. Тогда gh-pages скачивает свежую ветку, и публикация повторяется
        for attempt in 1 2 3 4 5; do
          npx gh-pages \
            --dist "$SOURCE" \
            --dest "$DEST" \
            --repo "$REPO" \
            --message "Publish $DEST ($GITHUB_SHA)" && exit 0
          sleep $((attempt * 2))
        done

        echo "::error::Не удалось опубликовать $DEST"
        exit 1
