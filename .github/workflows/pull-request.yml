name: Pull request

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

# Новый пуш в PR отменяет предыдущий запуск.
concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 50
      - name: Prepare environment
        uses: ./.github/workflows/prepare-environment
      - name: Lint
        uses: ./.github/workflows/lint

  test:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    environment:
      name: tests
      url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ github.head_ref }}/tests/
    steps:
      - uses: actions/checkout@v7
      - name: Prepare environment
        uses: ./.github/workflows/prepare-environment
      - name: Test
        uses: ./.github/workflows/build-tests
        with:
          # История main показывает, какие тесты в пулл реквесте новые и какие нестабильны в main.
          # Прогон пулл реквеста в историю main не попадает
          history-branch: main

  mod:
    needs: [lint, test]
    runs-on: ubuntu-latest
    environment:
      name: mod
      url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ github.head_ref }}/mod/peetland.lua
    steps:
      - uses: actions/checkout@v7
      - name: Prepare environment
        uses: ./.github/workflows/prepare-environment
      - name: Build mod
        uses: ./.github/workflows/build-mod

  docs:
    needs: [lint, test]
    runs-on: ubuntu-latest
    environment:
      name: docs
      url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ github.head_ref }}/docs/
    steps:
      - uses: actions/checkout@v7
      - name: Prepare environment
        uses: ./.github/workflows/prepare-environment
      - name: Build docs
        uses: ./.github/workflows/build-docs
        with:
          branch: ${{ github.head_ref }}

  # Публикует одним пушем всё, что собрали test, mod и docs. Запускается, даже если они упали или
  # пропущены: отчёт о тестах нужен и при упавших тестах
  publish:
    needs: [test, mod, docs]
    if: ${{ !cancelled() && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Prepare environment
        uses: ./.github/workflows/prepare-environment
      - name: Publish pages
        uses: ./.github/workflows/publish-pages
        with:
          branch: ${{ github.head_ref }}
          token: ${{ github.token }}

  remove-pages:
    # Папку main не удаляем, даже если main была веткой закрытого пулл реквеста
    if: github.event.action == 'closed' && github.head_ref != 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Prepare environment
        uses: ./.github/workflows/prepare-environment
      - name: Remove pages
        uses: ./.github/workflows/remove-pages
        with:
          branch: ${{ github.head_ref }}
          token: ${{ github.token }}
