name: Pull request

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

# Новый пуш в PR отменяет предыдущий запуск.
concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 50
      - name: Prepare environment
        uses: ./.github/workflows/prepare-environment
      - name: Lint
        uses: ./.github/workflows/lint

  test:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: tests
      url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ github.head_ref }}/tests/
    steps:
      - uses: actions/checkout@v7
      - name: Prepare environment
        uses: ./.github/workflows/prepare-environment
      - name: Test
        run: npm run test:report
      - name: Publish test report
        # Отчёт публикуется и при упавших тестах: на ревью он нужен, чтобы увидеть, что сломалось
        if: ${{ !cancelled() }}
        uses: ./.github/workflows/publish-pages
        with:
          branch: ${{ github.head_ref }}
          folder: tests
          source: .vitest
          token: ${{ github.token }}

  mod:
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: mod
      url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ github.head_ref }}/mod/peetland.lua
    steps:
      - uses: actions/checkout@v7
      - name: Prepare environment
        uses: ./.github/workflows/prepare-environment
      - name: Deploy mod
        uses: ./.github/workflows/deploy-mod
        with:
          branch: ${{ github.head_ref }}
          token: ${{ github.token }}

  docs:
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: docs
      url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ github.head_ref }}/docs/
    steps:
      - uses: actions/checkout@v7
      - name: Prepare environment
        uses: ./.github/workflows/prepare-environment
      - name: Deploy docs
        uses: ./.github/workflows/deploy-docs
        with:
          branch: ${{ github.head_ref }}
          token: ${{ github.token }}

  remove-pages:
    # Папку main не удаляем, даже если main была веткой закрытого пулл реквеста
    if: github.event.action == 'closed' && github.head_ref != 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Prepare environment
        uses: ./.github/workflows/prepare-environment
      - name: Remove pages
        uses: ./.github/workflows/remove-pages
        with:
          branch: ${{ github.head_ref }}
          token: ${{ github.token }}
