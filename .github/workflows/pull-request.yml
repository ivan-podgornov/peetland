name: Pull request

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

# Новый пуш в PR отменяет предыдущий запуск, в том числе висящий в ожидании подтверждения деплоя.
concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TAG: pr-${{ github.event.pull_request.number }}
  GH_REPO: ${{ github.repository }}
  GH_TOKEN: ${{ github.token }}

jobs:
  check:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 50
      - name: Prepare environment
        uses: ./.github/workflows/prepare-environment
      - name: Check types
        run: npm run check:types
      - name: Lint
        run: npm run check:code:all
      - name: Lint formatting
        run: npm run check:formatting:all
      - name: Test
        run: npm test

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare environment
        uses: ./.github/workflows/prepare-environment
      - name: Build
        run: npm run build -w @peetland/mod
      - uses: actions/upload-artifact@v7
        with:
          name: peetland
          path: mod/mod/dist/peetland.lua
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: preview
      url: https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/peetland.lua
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: peetland
      - name: Publish pre-release
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" peetland.lua \
            --prerelease \
            --target "$HEAD_SHA" \
            --title "PR #$PR_NUMBER: $PR_TITLE" \
            --notes "Сборка из $HEAD_REF ($HEAD_SHA)"

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete pre-release
        run: gh release delete "$TAG" --cleanup-tag --yes || true
