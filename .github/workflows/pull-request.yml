name: Pull request

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

# Новый пуш в PR отменяет предыдущий запуск.
concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TAG: pr-${{ github.event.pull_request.number }}
  GH_REPO: ${{ github.repository }}
  GH_TOKEN: ${{ github.token }}

jobs:
  lint:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 50
      - name: Prepare environment
        uses: ./.github/workflows/prepare-environment
      - name: Lint
        uses: ./.github/workflows/lint

  test:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare environment
        uses: ./.github/workflows/prepare-environment
      - name: Test
        run: npm test

  build-mod:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare environment
        uses: ./.github/workflows/prepare-environment
      - name: Build mod
        uses: ./.github/workflows/build-mod

  docs:
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: docs
      url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ github.head_ref }}/
    steps:
      - uses: actions/checkout@v7
      - name: Prepare environment
        uses: ./.github/workflows/prepare-environment
      - name: Deploy docs
        uses: ./.github/workflows/deploy-docs
        with:
          branch: ${{ github.head_ref }}
          token: ${{ github.token }}

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete pre-release
        run: gh release delete "$TAG" --cleanup-tag --yes || true

  remove-docs:
    # Документацию main не удаляем, даже если main была веткой закрытого пулл реквеста
    if: github.event.action == 'closed' && github.head_ref != 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Prepare environment
        uses: ./.github/workflows/prepare-environment
      - name: Remove docs
        uses: ./.github/workflows/remove-docs
        with:
          branch: ${{ github.head_ref }}
          token: ${{ github.token }}
